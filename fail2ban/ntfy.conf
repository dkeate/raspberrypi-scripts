[Definition]

# Action taken when an IP is banned
actionban = printf "**IP:** <ip>\n**Jail:** <name>\n**Failures:** <failures> attempts\n**Host:** <ip-host>\n**Action:** IP blocked" | \
            curl -s -f \
            -H "Title: 🚫 Fail2ban: IP Banned" \
            -H "Priority: <ntfy_priority_ban>" \
            -H "Tags: shield,warning" \
            -H "Markdown: yes" \
            --data-binary @- \
            <ntfy_url>/<ntfy_topic>

# Action taken when an IP is unbanned
actionunban = printf "**IP:** <ip>\n**Jail:** <name>\n**Status:** Ban expired, IP unblocked." | \
              curl -s -f \
              -H "Title: 🔓 Fail2ban: IP Unbanned" \
              -H "Priority: <ntfy_priority_unban>" \
              -H "Tags: white_check_mark" \
              -H "Markdown: yes" \
              --data-binary @- \
              <ntfy_url>/<ntfy_topic>

[Init]

# Default configuration options
ntfy_url = https://ntfy.sh
ntfy_topic = XXXXXXXXXX
ntfy_priority_ban = low
ntfy_priority_unban = min
